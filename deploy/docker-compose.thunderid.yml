# ThunderID — the identity provider for this project.
#
# ⚠️ TEMPORARY — LOCAL DEVELOPMENT ONLY. NOT A DEPLOYMENT RECIPE. ⚠️
#
# This file exists to pin the version Gate 23's spike validated against, and to give the
# developer one command that starts a login server on their own machine. It is the vendor's
# quick-start file with the image tag pinned; nothing else about it has been reviewed for
# production use, and four things are actively wrong for it — see the "Open decision" note
# under Gate 26 in docs/AUTH-PLAN.md, which is where this is owned:
#
#   1. port 8090 is published on ALL interfaces, not loopback;
#   2. the TLS certificate is self-signed (see note 1 below);
#   3. setup.sh destroys and regenerates all key material on recreation (see note 2 below);
#   4. the volumes hold the whole identity store with no backup and no tested restore.
#
# **The permanent deployment path has not been chosen yet.** The vendor's own production
# path is Kubernetes via their Helm chart (oci://ghcr.io/thunder-id/helm-charts/thunderid),
# not Compose. Hardening this file versus adopting the chart is a Gate 26 decision and is
# deliberately still open. Do not deploy this file to anything internet-reachable, and do
# not treat its presence in the repo as a decision that it will be.
#
# Adapted from ThunderID's official quick-start compose file
# (asgardeo/thunder → install/quick-start/docker-compose.yml), with one deliberate
# change: **the image is pinned to an exact version instead of `latest`.**
#
# Why the pin matters. The upstream quick-start uses `:latest`, and that is how this
# project's ThunderID silently moved from v1.0.0-rc to 1.0.0 between two sessions
# during Gate 23. For the component holding the entire login system, an unannounced
# upgrade is not acceptable — the version changes when we change it.
#
#   Image tag:  1.0.0   ← note: NO leading "v".
#               The *git* tag is `v1.0.0`, but the *image* tag drops it.
#               `ghcr.io/thunder-id/thunderid:v1.0.0` is a 404.
#   Released:   2026-08-15
#   Digest:     sha256:12b7348b6727b756b8155c5157804bc05ef5d0ffa5f42bc6307747bd18425a36
#
# To upgrade: bump the tag here, verify against ThunderID's release notes, and record
# the change in docs/AUTH-PLAN.md. Do not revert to `latest`.
#
# Run with:  docker compose -f deploy/docker-compose.thunderid.yml up -d
# Server:    https://localhost:8090        Console: https://localhost:8090/console
#
# Two things that surprise people, both documented in docs/AUTH-PLAN.md (Gate 23):
#
#  1. **The certificate is self-signed.** Browsers warn once and must be told to
#     proceed; HTTP clients need their CA trust configured. Fine locally, NOT fine
#     for a real deployment — Gate 26 needs a real certificate.
#
#  2. **`setup.sh` is not idempotent.** `thunderid-setup` has `restart: "no"`, but
#     `compose up` *recreates* one-shot containers rather than reusing exited ones, so
#     stopping and starting the stack re-runs setup. That regenerates the admin console
#     password, the TLS certificate, the JWT signing keys and the Direct Auth Secret.
#     Consequences: registrations in the database survive (they live in the volume),
#     but **every previously issued token stops verifying**, and the console password
#     from last session no longer works — read the new one from `thunderid-setup`'s logs.
#     Prefer leaving the stack running while working an auth gate.

services:
  # Seed the database files out of the image into the shared volume.
  thunderid-db-init:
    image: ghcr.io/thunder-id/thunderid:1.0.0
    command: sh -c "cp -r /opt/thunderid/database/* /data/"
    volumes:
      - thunderid-db:/data
    restart: "no"

  # One-shot setup: generates key material and the initial admin credentials.
  # See the non-idempotency note in the header before restarting this stack.
  thunderid-setup:
    image: ghcr.io/thunder-id/thunderid:1.0.0
    command: ./setup.sh
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Per-deployment TLS/JWT-signing/AES key material generated by setup.sh, shared with the server.
      - thunderid-certs:/opt/thunderid/config/certs
      # Direct Auth Secret generated by setup.sh, shared with the server.
      - thunderid-secrets:/opt/thunderid/config/secrets
    depends_on:
      thunderid-db-init:
        condition: service_completed_successfully
    restart: "no"

  # The server itself. Reads the key material the setup step produced.
  thunderid:
    image: ghcr.io/thunder-id/thunderid:1.0.0
    depends_on:
      thunderid-setup:
        condition: service_completed_successfully
    ports:
      - "8090:8090"
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Reads the key material generated by thunderid-setup into the shared certs volume.
      - thunderid-certs:/opt/thunderid/config/certs:ro
      # Reads the Direct Auth Secret generated by thunderid-setup into the shared secrets volume.
      - thunderid-secrets:/opt/thunderid/config/secrets:ro

# Named volumes, not bind mounts. This is where the data actually lives: deleting or
# recreating the containers does not touch it, but `docker compose down -v` destroys
# every registration, agent and role. Nothing here is backed up.
volumes:
  thunderid-db:
    driver: local
  thunderid-certs:
    driver: local
  thunderid-secrets:
    driver: local

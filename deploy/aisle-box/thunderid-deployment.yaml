# ThunderID configuration for the Aisle demo box — bind-mounted over the image's own copy.
#
# WHAT THIS FILE IS
# ThunderID is the login server. It ships its own /opt/thunderid/deployment.yaml inside the
# image, but that path is not on any named volume, so an edit made inside a running container
# is silently thrown away the next time the container is recreated. Keeping the file on the
# host and mounting it over the image's copy is how the settings survive.
#
# ⚠️ PINNED TO IMAGE 1.0.0. Extracted with `docker cp` from image tag 1.0.0. It now shadows
# whatever the image ships, so on ANY image bump you must re-extract the vendor's new file and
# diff it against this one — otherwise a new binary runs against a stale config.
#
# ── How this differs from deploy/thunderid-deployment.yaml (the developer's own copy) ──
#
# One difference, and it is deliberate: the developer's copy adds an
#
#     oauth:
#       dcr:
#         insecure: true
#
# block, which lets any client register itself against the login server WITHOUT
# authenticating. It exists there so Claude Code can reach ThunderID's own admin MCP server,
# and it is only tolerable because that port is published on loopback. **It is not in this
# file and must never be added to it.** This file is distributed to other people.
#
# NOTE: `server.hostname: 0.0.0.0` is correct and must stay. It is the bind address *inside*
# the container; binding loopback there would make the container unreachable. Exposure is
# restricted at the Compose port-publishing level (`127.0.0.1:8090:8090`) instead.
#
# NOTE: `public_url` is `https://localhost:8090` and every service in the box reaches it at
# exactly that address, including the ones running in other containers. That is what the
# shared network namespace in docker-compose.yml buys — see the comments there.

server:
  hostname: "0.0.0.0"
  public_url: "https://localhost:8090"
  port: 8090
  security:
    # Gates the Direct API endpoints. The secret is generated into config/secrets/direct_auth_secret
    # by setup.sh and read from there at load time. Callers present it in the Direct-Auth-Secret header.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_transient:
    type: "sqlite"
    sqlite:
      path: "database/runtime_transient.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_persistent:
    type: "sqlite"
    sqlite:
      path: "database/runtime_persistent.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
    preferred_key_id: "default-key"

passkey:
  allowed_origins:
    - "https://localhost:8090"

# This is a sample email client configuration. Update it with real SMTP server details for production use.
email:
  smtp:
    host: "127.0.0.1"
    port: 2525
    username: "dev"
    password: "dev"
    from_address: "noreply@thunderid.dev"
    enable_start_tls: false
    enable_authentication: true

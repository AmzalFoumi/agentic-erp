# CodeRabbit settings for this repository.
#
# ⚠️ READ THIS BEFORE ADDING A KEY. CodeRabbit does NOT merge configuration sources by
# default: if a repository has a .coderabbit.yaml, that file becomes the single source and
# every key it does not mention falls all the way through to the vendor's schema defaults -
# NOT to the Organization UI settings. This account's Organization UI turns on roughly sixty
# linters, the knowledge base and the finishing touches, so a file written the default way
# would have silently switched most of that off.
#
# `inheritance: true` is what prevents that. It makes this file MERGE over the Organization
# UI instead of replacing it, so what is written below is only the handful of things that
# differ from the account-wide settings. Objects deep-merge, arrays put this file's items
# first and append the parent's unique ones, scalars defined here win.
#
# Verified against docs.coderabbit.ai/configuration/configuration-inheritance on 2026-08-27,
# and against `@coderabbitai configuration` on PR #35, which reported `inheritance: false`
# and every other value sourced from "Organization UI (base)".
#
# To see which layer supplied any given value, comment `@coderabbitai configuration` on a PR.
inheritance: true

reviews:
  # ⚠️ NOT set here on purpose: `profile`. It is `assertive` account-wide, inheritance keeps
  # it that way, and the Organization UI stays the one place to change it. Writing it here
  # too would mean two places to keep in step. The same reasoning applies to the tool list.

  auto_review:
    # ⚠️ THIS IS THE LINE THAT FIXES A REAL GAP. `base_branches` lists branches to review
    # *in addition to* the default branch, and it was empty - so only PRs into `main` were
    # auto-reviewed. This project works feature -> dev -> main, which meant every feature PR
    # was silently skipped and had to be started by hand with `@coderabbitai review`.
    base_branches: ["dev"]

  # Files that are committed but never hand-edited. Reviewing generated output wastes a
  # review from the OSS rate-limit allowance and produces findings nobody can act on,
  # because the fix would be overwritten by the next generator run.
  path_filters:
    - "!frontend/src/lib/api/schema.d.ts" # generated by `npm run api:types`
    - "!deploy/aisle-box/thunderid-seed/*.db" # binary; seed-build/scan-seed.py is its gate

  path_instructions:
    - path: "backend/services/**"
      instructions: |
        These files must never import from api/ or mcp_server/ and must never mention web
        concepts - no HTTPException, no Request, no status codes, no fastapi/starlette/mcp/
        uvicorn/httpx imports. This is the project's one architectural rule and it is
        enforced mechanically by import-linter. Flag any violation as high severity.
        backend/core/ holds to the same restriction and additionally must not import jwt.

    - path: "deploy/aisle-box/**"
      instructions: |
        THUNDERID_VERIFY_TLS is a pydantic setting declared in backend/core/config.py and
        agent/config.py. Only this project's own Python code reads it. Do NOT ask for it on
        the alpine anchor, the ThunderID container or the Node container - they cannot act
        on it, and setting it there would be cargo cult. Certificate trust for those
        runtimes is SSL_CERT_FILE (Python, and it REPLACES the trust store rather than
        adding to it, so it must point at a merged bundle), THUNDERID_CA_CERT (the agent's
        own scoped setting) and NODE_EXTRA_CA_CERTS (Node, which adds). This has been raised
        and answered on PR #34 and PR #35; please do not raise it a third time.

    - path: "**/*.py"
      instructions: |
        This project documents at module level, with long module docstrings and inline
        comments that explain *why* a thing is the way it is - frequently citing the
        measurement or the incident behind it. Do not ask for per-function docstrings that
        only restate the function name. Do flag a comment that has drifted out of step with
        the code it describes, or a claim stated more confidently than the evidence supports.

  pre_merge_checks:
    docstrings:
      # Off rather than `warning`. The metric counts functions carrying a docstring, and it
      # reported 22% against an 80% threshold on PR #35 - while the files it measured open
      # with multi-paragraph module docstrings it cannot see. A check that reports red on a
      # well-documented file trains us to ignore it, which costs more than it is worth.
      mode: "off"
